<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9e1b2e">
<title>Amigo Oculto 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: festivo, caloroso, de turma de amigos no fim do ano
   IDEA: um cartão de Natal que abre e vira o app do amigo oculto
   PICTURE: presente embrulhado com etiqueta "?" sob neve caindo
   COLOUR/TYPE: vermelho-natal dominante, verde-pinheiro de apoio, dourado de acento; Baloo 2 + Nunito
   LAYOUT: coluna única mobile-first, barra de abas embaixo; até 520px centralizado no desktop */
:root{color-scheme:light dark;
--red:#9e1b2e;--red2:#c22a3c;--pine:#1f5c46;--gold:#f2b84b;
--bg:light-dark(#fbf6f1,#170c0f);--card:light-dark(#ffffff,#241417);--ink:light-dark(#2a1215,#f7eeee);
--muted:light-dark(#7a5e60,#c2a9ab);--line:light-dark(#efe1da,#3a2427);--soft:light-dark(#f6ebe5,#2d1a1d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
@media(min-width:620px){body{background:light-dark(#efe3dc,#0e0709)}.wrap{box-shadow:0 0 0 1px var(--line),0 30px 80px -40px #0006}}
h1,h2,h3{font-family:"Baloo 2",system-ui,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,10vw,46px);font-weight:800}
h2{font-size:28px;font-weight:800}
h3{font-size:19px;font-weight:600}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- Login ---------- */
.hero{position:relative;background:radial-gradient(120% 90% at 50% 0%,var(--red2),var(--red) 60%,#7a1222);color:#fff;
  padding:calc(env(safe-area-inset-top) + 26px) 22px 0;overflow:hidden;border-radius:0 0 32px 32px}
.hero .brand{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;opacity:.9}
.hero h1{margin-top:14px}
.hero p{opacity:.85;margin-top:6px;font-size:17px}
.gift{display:block;width:100%;max-width:300px;height:220px;margin:6px auto 0}
.snow{position:absolute;inset:0;pointer-events:none}
.snow i{position:absolute;top:-10px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.75;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(20px,420px,0)}}
@media(prefers-reduced-motion:reduce){.snow i{animation:none;display:none}}
.auth{padding:22px 22px 28px;display:flex;flex-direction:column;gap:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:4px}
.tabs button{border:0;background:none;min-height:44px;border-radius:11px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:14px;border:0;font-weight:700;font-size:16px;width:100%}
.btn.pri{background:var(--red);color:#fff}
.btn.pri:active{background:#841526}
.btn.ghost{background:var(--card);border:1.5px solid var(--line)}
.btn.small{min-height:44px;width:auto;padding:0 16px;font-size:15px}
.sep{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
input,textarea,select{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:12px 14px;font-size:16px}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--red2);outline:none}
.err{color:var(--red2);font-weight:700;font-size:14px;min-height:1em}
.demo{font-size:13px;color:var(--muted);text-align:center;line-height:1.4}
.demo b{color:var(--ink)}

/* ---------- App ---------- */
.top{background:var(--red);color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 20px 18px;display:flex;align-items:center;gap:12px;border-radius:0 0 24px 24px}
.top .t{flex:1}
.top small{opacity:.8;font-size:13px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:"Baloo 2";font-size:19px;flex:none;color:#fff}
.av.lg{width:76px;height:76px;font-size:32px}
main{flex:1;padding:20px 18px 110px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.field{display:flex;flex-direction:column;gap:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:6px 6px 6px 12px;font-weight:600;font-size:14px}
.chip button{border:0;background:var(--card);width:28px;height:28px;border-radius:50%;line-height:1;font-size:16px;color:var(--muted)}
.chip.ro{padding:6px 12px}
.row{display:flex;gap:8px}
.row input{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-family:"Baloo 2";font-size:28px;line-height:1;color:var(--red2)}
.stat span{font-size:13px;color:var(--muted)}
.people{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.person{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;min-height:72px;width:100%;text-align:left}
.person .n{flex:1;display:flex;flex-direction:column}
.person .n b{font-size:16px}
.person .n span{font-size:13px;color:var(--muted)}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.tag.adm{background:var(--gold);color:#3a2400}
.tag.g{background:light-dark(#e8f0fe,#1c2a44);color:light-dark(#1a56c4,#9cbcff)}
.tag.e{background:light-dark(#e6f2ec,#163126);color:light-dark(#1f5c46,#8fd3b3)}
.tag.warn{background:var(--soft);color:var(--muted)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.search{position:relative}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--pine);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
nav.bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav.bar button{flex:1;border:0;background:none;min-height:54px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);line-height:1.15;text-align:center;padding:0 2px}
nav.bar button.on{color:var(--red2);background:var(--soft)}
nav.bar svg{width:24px;height:24px}

/* ---------- Sheet ---------- */
.veil{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:90dvh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.kv{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:8px 12px;font-size:15px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.danger{color:var(--red2);border-color:light-dark(#f2c9cf,#5a2229)}
.note{font-size:13px;color:var(--muted);text-align:center}
.lead{color:var(--muted);font-size:16px}
.meter{height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;border-radius:6px;background:var(--pine);transition:width .3s}
.meter.low i{background:var(--gold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.rate{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.rate .who{display:flex;align-items:center;gap:12px}
.rate .who b{flex:1}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on[data-v="2"]{background:var(--red);border-color:var(--red);color:#fff}
.seg button.on[data-v="1"]{background:var(--gold);border-color:var(--gold);color:#3a2400}
.seg button.on[data-v="0"]{background:var(--soft);border-color:var(--muted);color:var(--ink)}
.reveal{background:linear-gradient(150deg,var(--pine),#143f30);color:#fff;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.reveal h2{color:#fff}
.reveal .lead{color:#ffffffcc}
.reveal .btn{background:var(--gold);color:#3a2400}
.reveal .chip{background:#ffffff22;color:#fff}
.reveal .kv dt{color:#ffffffaa}
.reveal .tag{background:#ffffff26;color:#fff}
.ok{color:var(--pine);font-weight:800}
.bad{color:var(--red2);font-weight:800}
.pend{display:flex;flex-wrap:wrap;gap:6px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.checks .ic{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;background:var(--pine)}
.checks .ic.x{background:var(--red2)}
.checks.anim li{opacity:0;animation:pop .35s ease forwards}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.checks.anim li{animation:none;opacity:1}}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:700;background:var(--soft);border-radius:8px;padding:3px 8px;white-space:nowrap;font-size:14px}
.pairs{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.pair{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:12px;font-size:14px}
.pair .arr{color:var(--muted)}
.pair .nm{color:var(--muted);font-size:13px}
.pair .tag{margin-left:auto}
.cyc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.switch input{width:52px;min-height:30px;height:30px;accent-color:var(--red)}
.testbar{background:var(--gold);color:#3a2400;font-weight:800;text-align:center;padding:8px;border-radius:12px;font-size:14px}
.reveal .code{background:#ffffff22;color:#fff}
.top .out{border:0;background:#ffffff22;color:#fff;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.top .out svg{width:22px;height:22px}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(max-width:350px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cat{min-height:64px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:14px;line-height:1.2;padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.cat i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-family:"Baloo 2";font-weight:800;font-size:15px;color:#fff}
.cat.on{background:var(--red);border-color:var(--red);color:#fff}
.cat.on i{background:#fff!important;color:var(--red)}
.cat:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled{opacity:.45;cursor:not-allowed}
a.btn{text-decoration:none;color:inherit}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.steps b{white-space:nowrap}
.det{display:flex;flex-direction:column;gap:10px}
.det h3{display:flex;align-items:center;gap:10px}
.det h3 i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-weight:800;color:#fff;font-size:16px}
.ideas{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.idea{border:1.5px dashed var(--line);background:none;border-radius:999px;min-height:36px;padding:4px 12px;font-size:14px;font-weight:600;color:var(--ink)}
.gcat{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid #ffffff22}
.gcat b{display:flex;align-items:center;gap:8px}
.gcat b i{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-size:13px;background:#fff!important;color:var(--pine)}
.chain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.chain li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px}
.chain .num{width:28px;height:28px;border-radius:50%;background:var(--gold);color:#3a2400;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.chain .arr{color:var(--muted);font-size:14px}
.reveal .chain .arr{color:#ffffffaa}
.lock{display:inline-flex;align-items:center;gap:6px;background:var(--pine);color:#fff;border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px;align-self:flex-start}
.testtag{display:inline-flex;background:var(--gold);color:#3a2400;border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px;align-self:flex-start}
.sec{display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:1px solid var(--line)}
.poscard{display:flex;align-items:center;gap:16px;background:var(--gold);color:#3a2400;border-radius:22px;padding:18px 20px}
.poscard .big{flex:none;width:72px;height:72px;border-radius:50%;background:#fff;color:var(--red);display:grid;place-items:center;font-family:"Baloo 2";font-weight:800;font-size:clamp(30px,9vw,40px);line-height:1}
.poscard h3{font-size:20px}.poscard p{font-size:15px;margin-top:2px}
.poscard.wait{background:var(--card);color:var(--ink);border:1.5px dashed var(--line)}
.poscard.wait .big{background:var(--soft);color:var(--muted)}
.sheetcat{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
</style>
</head>

<script type="module">

        <div class="pairs" style="margin-top:8px">${A.pairs.map(p => `<div class="pair"><span class="code">${esc(p.g)}</span><span class="arr">→</span><span class="code">${esc(p.r)}</span><span class="tag ${p.lv === 'Muita' ? 'adm' : 'warn'}">${esc(p.lv)}</span></div>`).join('')}</div></details>
      <details><summary style="font-weight:700;cursor:pointer;min-height:44px;display:flex;align-items:center">Ver a corrente por código</summary>
        <div class="cyc" style="margin-top:8px">${[...A.chain, A.chain[0]].map(c => `<span class="code">${esc(c)}</span>`).join('<span class="arr">→</span>')}</div></details>` : '<p class="note">Carregando auditoria...</p>'}
    </div>`;
  }
  const T = S.test, enough = us.length >= MIN_PARTICIPANTS, canFinal = !pend.length && !notReg.length && enough;
  return `<div class="card" style="display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;justify-content:space-between;gap:10px;font-weight:700"><span>Prontos pro sorteio</span><span>${us.length - pend.length} de ${allowed.length}</span></div>
    <div class="meter ${pend.length || notReg.length ? 'low' : ''}"><i style="width:${allowed.length ? (us.length - pend.length) / allowed.length * 100 : 0}%"></i></div>
    ${pend.length ? `<p class="lead" style="font-size:14px">Faltam avaliar a intimidade ou chegar a ${MIN_CIRCLE} no círculo:</p><div class="pend">${pend.map(([, p]) => `<span class="chip ro">${first(p.nome) || 'Sem nome'}</span>`).join('')}</div>` : ''}
    ${notReg.length ? `<p class="lead" style="font-size:14px">Liberados que ainda não se cadastraram:</p><div class="pend">${notReg.map(e => `<span class="chip ro">${esc(e)}</span>`).join('')}</div>` : ''}
    <div class="sec">
      <span class="testtag">Sorteio de teste</span>
      <p class="lead" style="font-size:14px">Não vale. Todo mundo vê a corrente com nomes. Roda quantas vezes quiser. Não usa as intimidades, pra não expor quem marcou quem.</p>
      ${runSteps('teste')}
      ${T ? `<h3>Teste nº ${T.no} · ${fmt(T.at)}</h3>${checksHTML(T.checks, anim)}<p style="font-weight:800" class="${T.checks.every(c => c.ok) ? 'ok' : 'bad'}">${T.checks.every(c => c.ok) ? 'Teste válido' : 'Teste com problema'}</p>
      <details><summary style="font-weight:700;cursor:pointer;min-height:44px;display:flex;align-items:center">Ver a corrente do teste</summary><div style="margin-top:8px">${chainHTML(T.chain || [])}</div></details>` : ''}
    </div>
    <div class="sec">
      <span class="lock">${LOCK}Sorteio oficial</span>
      <p class="lead" style="font-size:14px">Acontece uma vez só, com as intimidades valendo. Depois disso ninguém mexe: sem refazer, sem ver nomes, sem adicionar ou remover gente.</p>
      <div style="display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:15px"><span>Participantes cadastrados</span><span class="${enough ? 'ok' : 'bad'}">${us.length} · mínimo ${MIN_PARTICIPANTS}</span></div>
      ${!canFinal ? `<p style="font-size:14px"><span class="bad">Ainda não dá:</span> ${!enough ? `precisa de pelo menos ${MIN_PARTICIPANTS} pessoas cadastradas, pra cada um ter ${MIN_CIRCLE} opções no círculo e o sorteio não ficar previsível. ` : ''}Todo mundo liberado precisa se cadastrar, avaliar a intimidade com todos e ter pelo menos ${MIN_CIRCLE} no círculo.</p>` : ''}
      ${canFinal ? runSteps('oficial') : ''}
    </div>
  </div>`;
}

function viewAdmin() {
  const allowed = S.cfg.allowed || [], admins = S.cfg.admins || [];
  const list = Object.entries(S.users).filter(([, u]) => { const q = S.q.toLowerCase(); return !q || (u.nome + ' ' + u.email + ' ' + (u.apelido || '')).toLowerCase().includes(q); })
    .sort((a, b) => (a[1].nome || '').localeCompare(b[1].nome || ''));
  const regEmails = Object.values(S.users).map(u => lower(u.email));
  const waiting = allowed.filter(e => !regEmails.includes(e));
  return `<main>
  <h2>Sorteio</h2>${drawCard()}
  <h2>Participantes</h2>
  <div class="stats">
    <div class="stat"><b>${allowed.length}<small style="font-size:15px;color:var(--muted)">/${MAX_USERS}</small></b><span>Liberados</span></div>
    <div class="stat"><b>${Object.values(S.users).filter(filled).length}</b><span>Perfis completos</span></div>
    <div class="stat"><b>${admins.length}<small style="font-size:15px;color:var(--muted)">/${MAX_ADM}</small></b><span>Admins</span></div>
  </div>
  <input id="q" type="search" placeholder="Buscar por nome ou e-mail" aria-label="Buscar" value="${esc(S.q)}">
  <ul class="people">${list.map(([id, u]) => `<li><button class="person" data-open="${id}">
    <div class="av" style="background:${col(id)}">${ini(u.nome)}</div>
    <div class="n"><b>${esc(u.nome) || 'Sem nome'}</b><span>${esc(u.email)}</span>
      <div class="meta"><span class="tag ${u.metodo === 'google' ? 'g' : 'e'}">${u.metodo === 'google' ? 'Google' : 'E-mail'}</span>${admins.includes(lower(u.email)) ? '<span class="tag adm">Admin</span>' : ''}${filled(u) ? '' : '<span class="tag warn">Perfil incompleto</span>'}</div></div>
  </button></li>`).join('') || '<p class="note">Ninguém encontrado.</p>'}</ul>
  ${waiting.length ? `<div class="card" style="display:flex;flex-direction:column;gap:10px"><h3>Aguardando cadastro</h3>${waiting.map(e => `<div class="pair"><span style="overflow-wrap:anywhere">${esc(e)}</span>${locked() ? '' : `<button class="btn ghost small" style="margin-left:auto" data-unallow="${esc(e)}">Tirar</button>`}</div>`).join('')}</div>` : ''}
  ${locked() ? '' : `<form id="allowForm" class="card" style="display:flex;flex-direction:column;gap:12px">
    <h3>Liberar e-mail</h3><p class="lead" style="font-size:14px">Só quem estiver nessa lista consegue entrar. Usa o mesmo e-mail que a pessoa vai usar no login (Gmail, se for entrar com Google).</p>
    <input id="nEmail" type="email" inputmode="email" placeholder="email@exemplo.com" value="${esc(dv('nEmail'))}">
    <button class="btn ghost" type="submit" ${allowed.length >= MAX_USERS ? 'disabled' : ''}>Liberar</button>
  </form>`}
  </main>`;
}

function sheet(id) {
  const u = S.users[id]; if (!u) return '';
  const admins = S.cfg.admins || [], adm = admins.includes(lower(u.email)), self = id === S.user.uid;
  return `<div class="veil" id="veil"><div class="sheet" role="dialog" aria-modal="true" aria-label="Perfil de ${esc(u.nome)}">
    <div class="grab"></div>
    <div style="display:flex;gap:14px;align-items:center"><div class="av lg" style="background:${col(id)}">${ini(u.nome)}</div>
      <div><h2>${esc(u.nome)}</h2><div class="meta"><span class="tag ${u.metodo === 'google' ? 'g' : 'e'}">${u.metodo === 'google' ? 'Login com Google' : 'Login com e-mail e senha'}</span>${adm ? '<span class="tag adm">Admin</span>' : ''}</div></div></div>
    <dl class="kv card">
      <dt>E-mail</dt><dd>${esc(u.email)}</dd><dt>Apelido</dt><dd>${esc(u.apelido) || '—'}</dd><dt>Camisa</dt><dd>${esc(u.camisa) || '—'}</dd>
      <dt>Calçado</dt><dd>${esc(u.calcado) || '—'}</dd><dt>Não curte</dt><dd>${esc(u.nao) || '—'}</dd><dt>Recado</dt><dd>${esc(u.obs) || '—'}</dd>
      <dt>Último acesso</dt><dd>${fmt(u.acesso)}</dd>
    </dl>
    <div><h3 style="margin-bottom:8px">Gostos (${(u.cats || []).length}/${MAX_CATS})</h3>${catsHTML(u, 'sheetcat')}</div>
    <p class="note">${S.people[id]?.ready ? 'Pronto pro sorteio' : 'Ainda não terminou a intimidade'} · as respostas de intimidade são privadas.</p>
    ${self ? '<p class="note">Este é o teu perfil.</p>' : `
    <button class="btn ghost" data-adm="${id}" ${!adm && admins.length >= MAX_ADM ? 'disabled' : ''}>${adm ? 'Remover de admin' : (admins.length >= MAX_ADM ? 'Limite de 3 admins atingido' : 'Tornar admin')}</button>
    ${locked() ? '' : `<button class="btn ghost danger" data-del="${id}">${S.delConfirm === id ? 'Toca de novo pra remover' : 'Remover participante'}</button>`}`}
    <button class="btn pri" data-close>Fechar</button>
  </div></div>`;
}

function render() {
  const a = document.activeElement, aid = a && a.id, sel = aid && a.setSelectionRange ? [a.selectionStart, a.selectionEnd] : null;
  if (S.phase === 'loading') app.innerHTML = viewMsg('Carregando...', 'Só um instante.');
  else if (S.phase === 'login') app.innerHTML = viewLogin();
  else if (S.phase === 'verify') app.innerHTML = viewMsg('Confirma teu e-mail', `Mandamos um link pra <b>${esc(S.user.email)}</b>. Abre, confirma e volta aqui.${S.err ? `<br><span class="bad">${esc(S.err)}</span>` : ''}`,
    '<button class="btn pri" data-verified>Já confirmei</button><button class="btn ghost" data-resend>Reenviar e-mail</button>');
  else if (S.phase === 'denied') app.innerHTML = viewMsg('Ainda não liberado', `O e-mail <b>${esc(S.user.email)}</b> não está na lista do amigo oculto. Pede pra um admin liberar e depois entra de novo.`);
  else if (S.phase === 'closed') app.innerHTML = viewMsg('Inscrições fechadas', 'O sorteio oficial já aconteceu, então não dá mais pra entrar.');
  else if (S.phase === 'app' && S.me && S.cfg) {
    if (S.tab === 'admin' && !isAdmin()) S.tab = 'amigo';
    const V = { admin: viewAdmin, intim: viewIntim, gostos: viewGostos, amigo: viewAmigo, perfil: viewPerfil };
    app.innerHTML = topBar() + V[S.tab]() +
      `<nav class="bar" aria-label="Navegação">
       <button class="${S.tab === 'amigo' ? 'on' : ''}" data-tab="amigo">${ICON.gift}Meu amigo</button>
       <button class="${S.tab === 'gostos' ? 'on' : ''}" data-tab="gostos">${ICON.star}Gostos</button>
       <button class="${S.tab === 'intim' ? 'on' : ''}" data-tab="intim">${ICON.intim}Intimidade</button>
       <button class="${S.tab === 'perfil' ? 'on' : ''}" data-tab="perfil">${ICON.perfil}Perfil</button>
       ${isAdmin() ? `<button class="${S.tab === 'admin' ? 'on' : ''}" data-tab="admin">${ICON.admin}Admin</button>` : ''}</nav>` + (S.open ? sheet(S.open) : '');
  } else app.innerHTML = viewMsg('Carregando...', 'Só um instante.');
  if (aid) { const n = document.getElementById(aid); if (n) { n.focus({ preventScroll: true }); if (sel && n.setSelectionRange) try { n.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
}
let rq = 0; const schedule = () => { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; render(); }); };

/* ---------------- Firebase: sessão e dados ---------------- */
function stopAll() { unsubs.forEach(f => f()); unsubs = []; }
function listen(ref, fn) { unsubs.push(onSnapshot(ref, fn, e => console.warn('listener', e.code))); }

async function boot(user) {
  stopAll();
  Object.assign(S, { user, cfg: null, me: null, people: {}, intim: {}, test: null, result: null, recv: null, position: null, users: {}, audit: null, revealed: false, open: null, err: '', info: '', busy: '' });
  if (!user) { S.phase = 'login'; return render(); }
  const pass = user.providerData.some(p => p.providerId === 'password');
  if (pass && !user.emailVerified) { S.phase = 'verify'; return render(); }
  S.phase = 'loading'; render();
  let cfg;
  try { cfg = (await getDoc(doc(db, 'config/app'))).data(); }
  catch (e) { S.phase = 'denied'; return render(); }
  const uid = user.uid, meRef = doc(db, 'users', uid);
  try {
    const snap = await getDoc(meRef);
    if (!snap.exists()) {
      if (cfg.finalLocked) { S.phase = 'closed'; return render(); }
      const nome = user.displayName || '';
      await setDoc(meRef, { nome, email: lower(user.email), metodo: pass ? 'email' : 'google', apelido: '', camisa: '', calcado: '', nao: '', obs: '', cats: [], criadoEm: serverTimestamp(), acesso: serverTimestamp() });
      await setDoc(doc(db, 'people', uid), { nome, ready: false });
    } else updateDoc(meRef, { acesso: serverTimestamp() }).catch(() => {});
  } catch (e) { S.phase = 'denied'; return render(); }
  S.phase = 'app';
  listen(doc(db, 'config/app'), s => { const was = isAdmin(); S.cfg = s.data(); if (isAdmin() && !was) adminListeners(); schedule(); });
  listen(meRef, s => { S.me = s.data(); schedule(); });
  listen(collection(db, 'people'), s => { S.people = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); syncReady(); schedule(); });
  listen(doc(db, 'intim', uid), s => { S.intim = s.data()?.r || {}; syncReady(); schedule(); });
  listen(doc(db, 'tests/latest'), s => { const n = s.exists() ? s.data() : null; if (n && S.test && n.no !== S.test.no) { S.anim = true; toast('Teste nº ' + n.no + ' chegou'); } S.test = n; schedule(); });
  listen(doc(db, 'positions', uid), s => { S.position = s.exists() ? s.data() : null; schedule(); });
  listen(doc(db, 'results', uid), s => {
    S.result = s.exists() ? s.data() : null;
    if (S.result && !S.recvSub) { S.recvSub = true; listen(doc(db, 'users', S.result.receiver), r => { S.recv = r.data(); schedule(); }); }
    schedule();
  });
}
let adminOn = false;
function adminListeners() {
  if (adminOn) return; adminOn = true;
  listen(collection(db, 'users'), s => { S.users = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); schedule(); });
  listen(doc(db, 'audit/final'), s => { S.audit = s.exists() ? s.data() : null; schedule(); });
}
// mantém people/{uid}.ready em dia (o servidor confere de novo na hora do oficial)
let lastReady = null;
function syncReady() {
  if (!S.user || !S.people[S.user.uid] || locked()) return;
  const r = ready();
  if (r !== lastReady && r !== S.people[S.user.uid].ready) { lastReady = r; updateDoc(doc(db, 'people', S.user.uid), { ready: r }).catch(() => {}); }
}
onAuthStateChanged(auth, u => { adminOn = false; S.recvSub = false; lastReady = null; boot(u); });

/* ---------------- Ações ---------------- */
const saveCats = cats => updateDoc(doc(db, 'users', S.user.uid), { cats }).catch(e => toast(errMsg(e)));
async function addItem(k) {
  const inp = document.getElementById('it-' + k), val = (inp?.value || '').trim(); if (!val) return;
  const cats = structuredClone(S.me.cats || []), x = cats.find(c => c.k === k);
  if (x.it.length >= 8) return toast('Máximo de 8 itens por categoria');
  if (!x.it.includes(val)) x.it.push(val);
  delete S.draft['it-' + k]; S.me.cats = cats; render(); document.getElementById('it-' + k)?.focus(); saveCats(cats);
}

app.addEventListener('click', async e => {
  const t = e.target.closest('button,#veil'); if (!t) return;
  if (t.id === 'veil' && e.target !== t) return;
  const d = t.dataset;
  if (d.auth) { S.authTab = d.auth; S.err = ''; S.info = ''; render(); }
  else if (t.id === 'google') {
    S.err = ''; const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
    try { await signInWithPopup(auth, p); }
    catch (er) { if (er.code === 'auth/popup-blocked' || er.code === 'auth/operation-not-supported-in-this-environment') signInWithRedirect(auth, p); else { S.err = errMsg(er); render(); } }
  }
  else if ('resetPass' in d) {
    const em = lower(document.getElementById('fEmail').value);
    if (!em) { S.err = 'Coloca teu e-mail no campo acima primeiro.'; return render(); }
    try { await sendPasswordResetEmail(auth, em); S.err = ''; S.info = 'Se esse e-mail tiver conta, chega um link pra trocar a senha.'; } catch (er) { S.err = errMsg(er); } render();
  }
  else if ('verified' in d) { await reload(auth.currentUser); await auth.currentUser.getIdToken(true); if (auth.currentUser.emailVerified) boot(auth.currentUser); else { S.err = 'Ainda não aparece como confirmado. Abriu o link?'; render(); } }
  else if ('resend' in d) { try { await sendEmailVerification(auth.currentUser); toast('E-mail reenviado'); } catch (er) { toast(errMsg(er)); } }
  else if ('logout' in d) { stopAll(); signOut(auth); S.tab = 'amigo'; S.draft = {}; }
  else if (d.tab) { S.tab = d.tab; render(); window.scrollTo(0, 0); }
  else if (d.open) { S.open = d.open; render(); }
  else if ('close' in d || t.id === 'veil') { S.open = null; render(); }
  else if ('reveal' in d) { S.revealed = true; render(); }
  else if ('hide' in d) { S.revealed = false; render(); }
  else if (d.cat) {
    const cats = structuredClone(S.me.cats || []), i = cats.findIndex(x => x.k === d.cat);
    if (i >= 0) cats.splice(i, 1); else if (cats.length < MAX_CATS) cats.push({ k: d.cat, it: [] }); else return;
    S.me.cats = cats; render(); saveCats(cats);
  }
  else if (d.add) addItem(d.add);
  else if (d.idea) { const cats = structuredClone(S.me.cats || []), x = cats.find(c => c.k === d.idea); if (x && !x.it.includes(d.t) && x.it.length < 8) x.it.push(d.t); S.me.cats = cats; render(); saveCats(cats); }
  else if (d.rmit) { const cats = structuredClone(S.me.cats || []), x = cats.find(c => c.k === d.rmit); x.it.splice(+d.i, 1); S.me.cats = cats; render(); saveCats(cats); }
  else if (d.rate) {
    if (locked()) return;
    S.intim = { ...S.intim, [d.rate]: +d.v }; render();
    setDoc(doc(db, 'intim', S.user.uid), { r: { [d.rate]: +d.v } }, { merge: true }).catch(er => toast(errMsg(er)));
  }
  else if (d.adm) {
    const em = lower(S.users[d.adm].email), adms = S.cfg.admins || [];
    if (adms.includes(em) && adms.length <= 1) return toast('Precisa ter pelo menos 1 admin');
    updateDoc(doc(db, 'config/app'), { admins: adms.includes(em) ? arrayRemove(em) : arrayUnion(em) }).then(() => toast('Admins atualizados')).catch(er => toast(errMsg(er)));
  }
  else if (d.del) {
    if (locked()) return;
    if (S.delConfirm !== d.del) { S.delConfirm = d.del; toast('Toca de novo pra confirmar'); setTimeout(() => { S.delConfirm = null; }, 4000); return; }
    const em = lower(S.users[d.del].email);
    try {
      await updateDoc(doc(db, 'config/app'), { allowed: arrayRemove(em), admins: arrayRemove(em) });
      await Promise.all(['users', 'people', 'intim'].map(c => deleteDoc(doc(db, c, d.del)).catch(() => {})));
      await deleteDoc(doc(db, 'tests/latest')).catch(() => {});
      S.open = null; S.delConfirm = null; toast('Participante removido'); render();
    } catch (er) { toast(errMsg(er)); }
  }
  else if (d.unallow) { updateDoc(doc(db, 'config/app'), { allowed: arrayRemove(d.unallow) }).catch(er => toast(errMsg(er))); }
  else if ('audit' in d) { S.anim = true; render(); }
});

app.addEventListener('keydown', e => { if (e.target.dataset?.item && e.key === 'Enter') { e.preventDefault(); addItem(e.target.dataset.item); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.open) { S.open = null; render(); } });
app.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; render(); return; }
  if (t.id && t.id !== 'fSenha') S.draft[t.id] = t.value;
});
app.addEventListener('change', e => { const t = e.target; if (t.tagName === 'SELECT' && t.id) S.draft[t.id] = t.value; });

app.addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target, v = id => (document.getElementById(id)?.value || '').trim();
  if (f.id === 'authForm') {
    const em = lower(v('fEmail')), senha = document.getElementById('fSenha').value;
    if (!/^\S+@\S+\.\S+$/.test(em)) { S.err = 'Coloca um e-mail válido.'; return render(); }
    S.busy = 'auth'; S.err = ''; S.info = ''; render();
    try {
      if (S.authTab === 'criar') {
        const nome = v('fNome'); if (!nome) { S.busy = ''; S.err = 'Diz teu nome.'; return render(); }
        const cr = await createUserWithEmailAndPassword(auth, em, senha);
        await updateProfile(cr.user, { displayName: nome });
        await sendEmailVerification(cr.user);
        boot(cr.user);
      } else await signInWithEmailAndPassword(auth, em, senha);
    } catch (er) { S.err = errMsg(er); }
    S.busy = ''; S.draft = {}; render();
  } else if (f.id === 'perfilForm') {
    const data = { nome: v('pNome') || S.me.nome, apelido: v('pApelido'), camisa: v('pCamisa'), calcado: v('pCalcado'), nao: v('pNao'), obs: v('pObs') };
    try {
      await updateDoc(doc(db, 'users', S.user.uid), data);
      await updateDoc(doc(db, 'people', S.user.uid), { nome: data.nome });
      ['pNome', 'pApelido', 'pCamisa', 'pCalcado', 'pNao', 'pObs'].forEach(k => delete S.draft[k]);
      toast('Perfil salvo!');
    } catch (er) { toast(errMsg(er)); }
  } else if (f.id === 'allowForm') {
    const em = lower(v('nEmail'));
    if (!/^\S+@\S+\.\S+$/.test(em)) return toast('Coloca um e-mail válido');
    if ((S.cfg.allowed || []).includes(em)) return toast('Esse e-mail já está liberado');
    try { await updateDoc(doc(db, 'config/app'), { allowed: arrayUnion(em) }); delete S.draft.nEmail; toast(em + ' liberado'); render(); }
    catch (er) { toast(errMsg(er)); }
  }
});

render();

</script>
</body>
</html>
